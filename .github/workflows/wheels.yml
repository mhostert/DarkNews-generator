name: Build & publish wheels

# Build binary wheels + sdist so users don't compile the Cython extension
# locally, and publish them to PyPI on tagged releases via Trusted Publishing
# (OIDC -- no API tokens stored in the repo).
#
# Release flow:  git tag vX.Y.Z && git push origin vX.Y.Z
#   -> builds the full wheel matrix + sdist, then publishes them to PyPI.
# A manual run (workflow_dispatch) builds and uploads artifacts but does NOT
# publish, so you can test the build without cutting a release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64 (manylinux/musllinux), Linux aarch64, and macOS. Both Linux
        # runners are native (no QEMU) and free for public repositories.
        #
        # macos-14 (Apple Silicon) covers BOTH macOS architectures: it builds arm64
        # natively and cross-compiles x86_64, per [tool.cibuildwheel.macos] in
        # pyproject.toml. The dedicated Intel runner (macos-13) was dropped because
        # it is the last Intel image and its queue stalled indefinitely, blocking
        # the publish job -- which requires every build job to succeed.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so setuptools_scm can resolve the version

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        # All cibuildwheel configuration lives in [tool.cibuildwheel] in pyproject.toml.

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so setuptools_scm can resolve the version
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish on tagged releases, never on manual/dispatch builds.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/DarkNews
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true # flatten all wheels-* and sdist artifacts into dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
