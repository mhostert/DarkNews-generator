[tox]
minversion = 3.8.0
envlist = py310, py311, py312, py313, report, clean
isolated_build = true
skipsdist = false
log_level = DEBUG

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
extras = testing
deps = 
    cython
    numpy
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONHASHSEED = 0

commands =
    pytest --basetemp={envtmpdir} --cov={envtmpdir} --cov-append --cov-report=xml --cov --junitxml=junit.xml -o junit_family=legacy
depends =
    {py310,py311,py312,py313}: clean
    report: py310,py311,py312,py313

[testenv:report]
deps = coverage
skip_install = true
commands =
    coverage report
    coverage html

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase